<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LAN Chat</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --accent: #4f46e5;
    --accent-dark: #4338ca;
    --text: #1f2330;
    --muted: #767b8a;
    --bubble-me: #4f46e5;
    --bubble-other: #eceef3;
    --border: #e2e4ea;
    --sidebar-bg: #fafafc;
  }
  
  :root.dark {
    --bg: #1a1a1a;
    --panel: #2a2a2a;
    --accent: #6366f1;
    --accent-dark: #4f46e5;
    --text: #e8e8e8;
    --muted: #a0a0a0;
    --bubble-me: #6366f1;
    --bubble-other: #3a3a3a;
    --border: #404040;
    --sidebar-bg: #252525;
  }
  
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.3s, color 0.3s;
  }

  /* ---- Auth screen ---- */
  #auth-screen {
    background: var(--panel);
    padding: 2.5rem;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    width: 100%;
    max-width: 380px;
    transition: background-color 0.3s;
  }
  #auth-screen h1 {
    margin: 0 0 0.25rem;
    font-size: 1.5rem;
  }
  #auth-screen p.sub {
    margin: 0 0 1.5rem;
    color: var(--muted);
    font-size: 0.9rem;
  }
  #auth-screen label {
    display: block;
    font-size: 0.85rem;
    margin-bottom: 0.35rem;
    color: var(--muted);
  }
  #auth-screen input {
    width: 100%;
    padding: 0.65rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 1rem;
    font-size: 1rem;
    background: var(--panel);
    color: var(--text);
    transition: background-color 0.3s, color 0.3s, border-color 0.3s;
  }
  #auth-screen button {
    width: 100%;
    padding: 0.7rem;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.3s;
  }
  #auth-screen button:hover { background: var(--accent-dark); }
  #auth-toggle {
    margin-top: 1rem;
    text-align: center;
    font-size: 0.9rem;
    color: var(--muted);
  }
  #auth-toggle a { color: var(--accent); cursor: pointer; text-decoration: none; font-weight: 600; }
  #auth-error {
    background: #fee2e2;
    color: #b91c1c;
    padding: 0.6rem 0.8rem;
    border-radius: 8px;
    font-size: 0.85rem;
    margin-bottom: 1rem;
    display: none;
  }
  
  /* Profile picture upload */
  #profile-picture-field {
    display: none;
    margin-bottom: 1rem;
  }
  #profile-picture-preview {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: var(--border);
    margin-bottom: 0.5rem;
    object-fit: cover;
    border: 2px solid var(--border);
  }
  #profile-picture-input {
    display: none;
  }
  #upload-picture-btn {
    width: 100%;
    padding: 0.5rem;
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    cursor: pointer;
    font-size: 0.9rem;
    margin-bottom: 1rem;
    transition: background-color 0.3s;
  }
  #upload-picture-btn:hover { background: #f1f1f4; }
  :root.dark #upload-picture-btn:hover { background: #3a3a3a; }

  /* ---- Chat screen ---- */
  #chat-screen {
    display: none;
    width: 100%;
    max-width: 900px;
    height: 90vh;
    background: var(--panel);
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    overflow: hidden;
    flex-direction: row;
    transition: background-color 0.3s;
  }
  #sidebar {
    width: 200px;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 1rem;
    transition: background-color 0.3s, border-color 0.3s;
  }
  #sidebar h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin: 0 0 0.75rem;
  }
  #nav-list { list-style: none; padding: 0; margin: 0 0 0.5rem; }
  #nav-list li {
    padding: 0.4rem 0.5rem;
    border-radius: 6px;
    font-size: 0.9rem;
    cursor: pointer;
    font-weight: 600;
    transition: background-color 0.2s;
  }
  #nav-list li:hover, #nav-list li.active { background: #eceef3; }
  :root.dark #nav-list li:hover, :root.dark #nav-list li.active { background: #3a3a3a; }
  #user-list { list-style: none; padding: 0; margin: 0; flex: 1; overflow-y: auto; }
  #user-list li {
    padding: 0.4rem 0.5rem;
    border-radius: 6px;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
    position: relative;
    transition: background-color 0.2s;
  }
  #user-list li:hover, #user-list li.active { background: #eceef3; }
  :root.dark #user-list li:hover, :root.dark #user-list li.active { background: #3a3a3a; }
  .user-avatar {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--border);
    object-fit: cover;
    flex-shrink: 0;
  }
  #user-list li::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #22c55e;
    display: inline-block;
    flex-shrink: 0;
  }
  #user-list li.offline::before { background: #d1d5db; }
  .unread-badge {
    margin-left: auto;
    background: var(--accent);
    color: white;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 0.05rem 0.4rem;
    border-radius: 10px;
  }
  #theme-toggle-btn {
    background: none;
    border: 1px solid var(--border);
    padding: 0.5rem;
    border-radius: 8px;
    cursor: pointer;
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 0.5rem;
    transition: background-color 0.3s, border-color 0.3s, color 0.3s;
  }
  #theme-toggle-btn:hover { background: #f1f1f4; }
  :root.dark #theme-toggle-btn:hover { background: #3a3a3a; }
  #logout-btn {
    background: none;
    border: 1px solid var(--border);
    padding: 0.5rem;
    border-radius: 8px;
    cursor: pointer;
    color: var(--muted);
    font-size: 0.85rem;
    transition: background-color 0.3s, border-color 0.3s, color 0.3s;
  }
  #logout-btn:hover { background: #f1f1f4; }
  :root.dark #logout-btn:hover { background: #3a3a3a; }

  #chat-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  #chat-header {
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    transition: border-color 0.3s;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }
  .msg-row { display: flex; flex-direction: column; max-width: 75%; gap: 0.3rem; }
  .msg-row.me { align-self: flex-end; align-items: flex-end; }
  .msg-row.other { align-self: flex-start; align-items: flex-start; }
  .msg-header { display: flex; align-items: center; gap: 0.4rem; }
  .msg-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--border);
    object-fit: cover;
    flex-shrink: 0;
  }
  .msg-meta { font-size: 0.75rem; color: var(--muted); transition: color 0.3s; }
  .msg-bubble {
    padding: 0.55rem 0.85rem;
    border-radius: 14px;
    font-size: 0.95rem;
    line-height: 1.4;
    word-wrap: break-word;
    white-space: pre-wrap;
    transition: background-color 0.3s, color 0.3s;
  }
  .msg-row.me .msg-bubble { background: var(--bubble-me); color: white; border-bottom-right-radius: 4px; }
  .msg-row.other .msg-bubble { background: var(--bubble-other); color: var(--text); border-bottom-left-radius: 4px; }
  .system-msg {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    margin: 0.3rem 0;
    transition: color 0.3s;
  }
  #input-bar {
    display: flex;
    gap: 0.6rem;
    padding: 1rem;
    border-top: 1px solid var(--border);
    transition: border-color 0.3s;
  }
  #msg-input {
    flex: 1;
    padding: 0.65rem 0.9rem;
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 0.95rem;
    outline: none;
    background: var(--panel);
    color: var(--text);
    transition: background-color 0.3s, color 0.3s, border-color 0.3s;
  }
  #send-btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 0 1.3rem;
    border-radius: 20px;
    cursor: pointer;
    font-weight: 600;
    transition: background-color 0.3s;
  }
  #send-btn:hover { background: var(--accent-dark); }
  #conn-status {
    font-size: 0.75rem;
    color: var(--muted);
    font-weight: normal;
    transition: color 0.3s;
  }
</style>
</head>
<body>

  <!-- AUTH SCREEN -->
  <div id="auth-screen">
    <h1 id="auth-title">Welcome back</h1>
    <p class="sub" id="auth-sub">Log in to join the chat</p>
    <div id="auth-error"></div>
    <form id="auth-form">
      <label for="username">Username</label>
      <input id="username" autocomplete="username" required maxlength="24" />
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required minlength="4" />
      <div id="profile-picture-field" style="display:none;">
        <label>Profile Picture</label>
        <img id="profile-picture-preview" style="display:none;" />
        <button type="button" id="upload-picture-btn">Choose Picture</button>
        <input id="profile-picture-input" type="file" accept="image/*" />
      </div>
      <div id="invite-field" style="display:none;">
        <label for="invite-code">Invite code</label>
        <input id="invite-code" autocomplete="off" />
      </div>
      <button type="submit" id="auth-submit">Log In</button>
    </form>
    <div id="auth-toggle">
      Don't have an account? <a id="auth-switch">Create one</a>
    </div>
  </div>

  <!-- CHAT SCREEN -->
  <div id="chat-screen">
    <div id="sidebar">
      <ul id="nav-list">
        <li id="public-nav" class="active"># Public chat</li>
      </ul>
      <h2>Direct message <a id="new-dm-link" style="cursor:pointer;font-weight:600;color:var(--accent);text-transform:none;">+ New</a></h2>
      <ul id="user-list"></ul>
      <button id="theme-toggle-btn">🌙 Dark mode</button>
      <button id="logout-btn">Log out</button>
    </div>
    <div id="chat-main">
      <div id="chat-header"><span id="chat-header-title">LAN Chat</span> <span id="conn-status"></span></div>
      <div id="messages"></div>
      <div id="input-bar">
        <input id="msg-input" placeholder="Type a message…" autocomplete="off" />
        <button id="send-btn">Send</button>
      </div>
    </div>
  </div>

<script>
(function () {
  const authScreen = document.getElementById('auth-screen');
  const chatScreen = document.getElementById('chat-screen');
  const authForm = document.getElementById('auth-form');
  const authTitle = document.getElementById('auth-title');
  const authSub = document.getElementById('auth-sub');
  const authSubmit = document.getElementById('auth-submit');
  const authSwitch = document.getElementById('auth-switch');
  const authError = document.getElementById('auth-error');
  const usernameInput = document.getElementById('username');
  const passwordInput = document.getElementById('password');
  const inviteField = document.getElementById('invite-field');
  const inviteCodeInput = document.getElementById('invite-code');
  const profilePictureField = document.getElementById('profile-picture-field');
  const profilePicturePreview = document.getElementById('profile-picture-preview');
  const profilePictureInput = document.getElementById('profile-picture-input');
  const uploadPictureBtn = document.getElementById('upload-picture-btn');
  const messagesEl = document.getElementById('messages');
  const userListEl = document.getElementById('user-list');
  const msgInput = document.getElementById('msg-input');
  const sendBtn = document.getElementById('send-btn');
  const logoutBtn = document.getElementById('logout-btn');
  const themeToggleBtn = document.getElementById('theme-toggle-btn');
  const connStatus = document.getElementById('conn-status');

  let mode = 'login'; // or 'register'
  let ws = null;
  let myUsername = null;
  let myProfilePicture = null;
  let profilePictureData = null; // Base64 image data for registration
  let darkMode = localStorage.getItem('lanchat_darkmode') === 'true';
  let userProfiles = {}; // username -> { picture: base64 }

  // Initialize theme
  function applyTheme() {
    if (darkMode) {
      document.documentElement.classList.add('dark');
      themeToggleBtn.textContent = '☀️ Light mode';
    } else {
      document.documentElement.classList.remove('dark');
      themeToggleBtn.textContent = '🌙 Dark mode';
    }
  }

  themeToggleBtn.addEventListener('click', () => {
    darkMode = !darkMode;
    localStorage.setItem('lanchat_darkmode', darkMode);
    applyTheme();
  });

  uploadPictureBtn.addEventListener('click', (e) => {
    e.preventDefault();
    profilePictureInput.click();
  });

  profilePictureInput.addEventListener('change', (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = (event) => {
      const result = event.target?.result;
      if (typeof result === 'string') {
        profilePictureData = result;
        profilePicturePreview.src = result;
        profilePicturePreview.style.display = 'block';
      }
    };
    reader.readAsDataURL(file);
  });

  function setMode(next) {
    mode = next;
    authError.style.display = 'none';
    profilePictureData = null;
    profilePicturePreview.style.display = 'none';
    if (mode === 'login') {
      authTitle.textContent = 'Welcome back';
      authSub.textContent = 'Log in to join the chat';
      authSubmit.textContent = 'Log In';
      authSwitch.textContent = 'Create one';
      document.getElementById('auth-toggle').firstChild.textContent = "Don't have an account? ";
      passwordInput.autocomplete = 'current-password';
      profilePictureField.style.display = 'none';
      inviteField.style.display = 'none';
      inviteCodeInput.required = false;
    } else {
      authTitle.textContent = 'Create an account';
      authSub.textContent = 'Pick a username and password to join';
      authSubmit.textContent = 'Sign Up';
      authSwitch.textContent = 'Log in';
      document.getElementById('auth-toggle').firstChild.textContent = 'Already have an account? ';
      passwordInput.autocomplete = 'new-password';
      profilePictureField.style.display = 'block';
      inviteField.style.display = 'block';
      inviteCodeInput.required = true;
    }
  }

  authSwitch.addEventListener('click', () => setMode(mode === 'login' ? 'register' : 'login'));

  authForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    authError.style.display = 'none';
    const username = usernameInput.value.trim();
    const password = passwordInput.value;
    const endpoint = mode === 'login' ? '/api/login' : '/api/register';
    const body = { username, password };
    if (mode === 'register') {
      body.inviteCode = inviteCodeInput.value;
      if (profilePictureData) {
        body.profilePicture = profilePictureData;
      }
    }

    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) {
        authError.textContent = data.error || 'Something went wrong';
        authError.style.display = 'block';
        return;
      }
      sessionStorage.setItem('lanchat_token', data.token);
      sessionStorage.setItem('lanchat_username', data.username);
      enterChat(data.token, data.username);
    } catch (err) {
      authError.textContent = 'Could not reach the server. Is it running?';
      authError.style.display = 'block';
    }
  });

  logoutBtn.addEventListener('click', () => {
    sessionStorage.removeItem('lanchat_token');
    sessionStorage.removeItem('lanchat_username');
    if (ws) ws.close();
    chatScreen.style.display = 'none';
    authScreen.style.display = 'block';
    messagesEl.innerHTML = '';
    conversations = { public: [] };
    currentConversation = 'public';
    onlineUsers = [];
    knownDmPartners = new Set();
    unread = {};
    setMode('login');
  });

  // ---- Conversation state ----
  let conversations = { public: [] };
  let currentConversation = 'public';
  let onlineUsers = [];
  let knownDmPartners = new Set();
  let unread = {};

  function conversationKey(msg) {
    if (msg.type !== 'private') return 'public';
    return msg.from === myUsername ? msg.to : msg.from;
  }

  function renderMessagesFor(key) {
    messagesEl.innerHTML = '';
    const msgs = conversations[key] || [];
    msgs.forEach((m) => {
      if (m.type === 'system') addSystemMessageDom(m.text);
      else addMessageDom(m);
    });
  }

  function addSystemMessageDom(text) {
    const div = document.createElement('div');
    div.className = 'system-msg';
    div.textContent = text;
    messagesEl.appendChild(div);
  }

  function addMessageDom(msg) {
    const senderName = msg.type === 'private' ? msg.from : msg.username;
    const row = document.createElement('div');
    row.className = 'msg-row ' + (senderName === myUsername ? 'me' : 'other');

    const header = document.createElement('div');
    header.className = 'msg-header';

    if (senderName !== myUsername) {
      const avatar = document.createElement('img');
      avatar.className = 'msg-avatar';
      avatar.alt = senderName;
      if (userProfiles[senderName]?.picture) {
        avatar.src = userProfiles[senderName].picture;
      }
      header.appendChild(avatar);
    }

    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    const time = new Date(msg.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    meta.textContent = (senderName === myUsername ? 'You' : senderName) + ' · ' + time;
    header.appendChild(meta);

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = msg.text;

    row.appendChild(header);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function storeAndMaybeRender(msg) {
    const key = conversationKey(msg);
    if (!conversations[key]) conversations[key] = [];
    conversations[key].push(msg);

    if (key !== 'public') knownDmPartners.add(key);

    if (currentConversation === key) {
      if (msg.type === 'system') addSystemMessageDom(msg.text);
      else addMessageDom(msg);
      scrollToBottom();
    } else {
      unread[key] = (unread[key] || 0) + 1;
      renderSidebar();
    }
  }

  function switchConversation(key) {
    currentConversation = key;
    unread[key] = 0;
    document.getElementById('public-nav').classList.toggle('active', key === 'public');
    document.getElementById('chat-header-title').textContent = key === 'public' ? 'LAN Chat' : ('💬 ' + key);
    renderMessagesFor(key);
    renderSidebar();
    scrollToBottom();
  }

  function renderSidebar() {
    userListEl.innerHTML = '';
    const allNames = new Set([...onlineUsers, ...knownDmPartners]);
    allNames.forEach((u) => {
      if (u === myUsername) return;
      const li = document.createElement('li');
      li.className = onlineUsers.includes(u) ? '' : 'offline';
      if (u === currentConversation) li.classList.add('active');

      const dot = document.createElement('span');
      dot.style.display = 'inline-block';
      li.appendChild(dot);

      if (userProfiles[u]?.picture) {
        const avatar = document.createElement('img');
        avatar.className = 'user-avatar';
        avatar.alt = u;
        avatar.src = userProfiles[u].picture;
        li.appendChild(avatar);
      }

      const label = document.createElement('span');
      label.textContent = u;
      li.appendChild(label);

      if (unread[u]) {
        const badge = document.createElement('span');
        badge.className = 'unread-badge';
        badge.textContent = unread[u];
        li.appendChild(badge);
      }

      li.addEventListener('click', () => switchConversation(u));
      userListEl.appendChild(li);
    });
  }

  document.getElementById('public-nav').addEventListener('click', () => switchConversation('public'));

  document.getElementById('new-dm-link').addEventListener('click', () => {
    const name = prompt('Username to message:');
    if (!name) return;
    const trimmed = name.trim();
    if (!trimmed || trimmed === myUsername) return;
    knownDmPartners.add(trimmed);
    switchConversation(trimmed);
  });

  function sendMessage() {
    const text = msgInput.value;
    if (!text.trim() || !ws || ws.readyState !== WebSocket.OPEN) return;
    if (currentConversation === 'public') {
      ws.send(JSON.stringify({ type: 'message', text }));
    } else {
      ws.send(JSON.stringify({ type: 'private', to: currentConversation, text }));
    }
    msgInput.value = '';
  }

  sendBtn.addEventListener('click', sendMessage);
  msgInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  function enterChat(token, username) {
    myUsername = username;
    authScreen.style.display = 'none';
    chatScreen.style.display = 'flex';
    messagesEl.innerHTML = '';
    connStatus.textContent = '(connecting…)';

    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(protocol + '//' + location.host);

    ws.addEventListener('open', () => {
      ws.send(JSON.stringify({ type: 'join', token }));
    });

    ws.addEventListener('message', (event) => {
      const data = JSON.parse(event.data);

      if (data.type === 'welcome') {
        connStatus.textContent = '(connected)';
        conversations = { public: data.history || [] };
        knownDmPartners = new Set(Object.keys(data.dms || {}));
        Object.entries(data.dms || {}).forEach(([other, msgs]) => {
          conversations[other] = msgs;
        });
        onlineUsers = data.users || [];
        userProfiles = data.profiles || {};
        if (data.myProfile?.picture) {
          myProfilePicture = data.myProfile.picture;
        }
        switchConversation('public');
        return;
      }

      if (data.type === 'message' || data.type === 'private' || data.type === 'system') {
        storeAndMaybeRender(data);
        return;
      }

      if (data.type === 'users') {
        onlineUsers = data.users || [];
        userProfiles = data.profiles || {};
        renderSidebar();
        return;
      }

      if (data.type === 'dm_error') {
        addSystemMessageDom(data.text);
        scrollToBottom();
        return;
      }

      if (data.type === 'auth_error') {
        logoutBtn.click();
        authError.textContent = data.text;
        authError.style.display = 'block';
      }
    });

    ws.addEventListener('close', () => {
      connStatus.textContent = '(disconnected)';
    });
    ws.addEventListener('error', () => {
      connStatus.textContent = '(connection error)';
    });
  }

  // Auto-login if we already have a session token in this tab
  const savedToken = sessionStorage.getItem('lanchat_token');
  const savedUsername = sessionStorage.getItem('lanchat_username');
  applyTheme();
  if (savedToken && savedUsername) {
    enterChat(savedToken, savedUsername);
  } else {
    setMode('login');
  }
})();
</script>
</body>
</html>
