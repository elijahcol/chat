<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LAN Chat</title>
<style>
  :root {
    --bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    --panel: rgba(255, 255, 255, 0.15);
    --panel-dark: rgba(255, 255, 255, 0.08);
    --accent: #667eea;
    --accent-light: #7c8ff5;
    --text: #ffffff;
    --text-secondary: rgba(255, 255, 255, 0.7);
    --muted: rgba(255, 255, 255, 0.5);
    --bubble-me: rgba(102, 126, 234, 0.9);
    --bubble-other: rgba(255, 255, 255, 0.2);
    --border: rgba(255, 255, 255, 0.2);
    --sidebar-bg: rgba(255, 255, 255, 0.1);
  }
  
  :root.dark {
    --bg: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    --panel: rgba(255, 255, 255, 0.08);
    --panel-dark: rgba(255, 255, 255, 0.04);
    --accent: #667eea;
    --accent-light: #7c8ff5;
    --text: #ffffff;
    --text-secondary: rgba(255, 255, 255, 0.7);
    --muted: rgba(255, 255, 255, 0.4);
    --bubble-me: rgba(102, 126, 234, 0.8);
    --bubble-other: rgba(255, 255, 255, 0.12);
    --border: rgba(255, 255, 255, 0.1);
    --sidebar-bg: rgba(255, 255, 255, 0.05);
  }
  
  * { box-sizing: border-box; }
  
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.3s, color 0.3s;
    backdrop-filter: blur(10px);
  }

  /* ---- Glassmorphism utilities ---- */
  .glass {
    background: var(--panel);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    -webkit-backdrop-filter: blur(20px);
  }

  .glass-dark {
    background: var(--panel-dark);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    -webkit-backdrop-filter: blur(20px);
  }

  /* ---- Auth screen ---- */
  #auth-screen {
    padding: 3rem 2.5rem;
    border-radius: 24px;
    width: 100%;
    max-width: 420px;
    transition: all 0.3s;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    animation: slideUp 0.4s ease-out;
  }

  @keyframes slideUp {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  #auth-screen.glass {
    background: var(--panel);
  }

  #auth-screen h1 {
    margin: 0 0 0.5rem;
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  #auth-screen p.sub {
    margin: 0 0 2rem;
    color: var(--text-secondary);
    font-size: 0.95rem;
  }

  #auth-screen label {
    display: block;
    font-size: 0.9rem;
    margin-bottom: 0.5rem;
    color: var(--text-secondary);
    font-weight: 500;
  }

  #auth-screen input {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 1.2rem;
    font-size: 1rem;
    background: rgba(255, 255, 255, 0.1);
    color: var(--text);
    transition: all 0.3s;
    backdrop-filter: blur(10px);
  }

  #auth-screen input:focus {
    outline: none;
    border-color: var(--accent-light);
    background: rgba(255, 255, 255, 0.15);
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
  }

  #auth-screen input::placeholder {
    color: var(--muted);
  }

  #auth-screen button {
    width: 100%;
    padding: 0.85rem;
    background: linear-gradient(135deg, var(--accent), var(--accent-light));
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
  }

  #auth-screen button:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(102, 126, 234, 0.4);
  }

  #auth-screen button:active {
    transform: translateY(0);
  }

  #auth-toggle {
    margin-top: 1.5rem;
    text-align: center;
    font-size: 0.9rem;
    color: var(--text-secondary);
  }

  #auth-toggle a {
    color: var(--accent-light);
    cursor: pointer;
    text-decoration: none;
    font-weight: 600;
    transition: color 0.3s;
  }

  #auth-toggle a:hover {
    color: var(--text);
  }

  #auth-error {
    background: rgba(239, 68, 68, 0.2);
    border: 1px solid rgba(239, 68, 68, 0.4);
    color: #fca5a5;
    padding: 0.8rem 1rem;
    border-radius: 12px;
    font-size: 0.9rem;
    margin-bottom: 1.2rem;
    display: none;
    backdrop-filter: blur(10px);
  }

  /* ---- Chat screen ---- */
  #chat-screen {
    display: none;
    width: 100%;
    max-width: 1200px;
    height: 90vh;
    border-radius: 24px;
    overflow: hidden;
    flex-direction: row;
    transition: all 0.3s;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
  }

  #chat-screen.glass {
    background: var(--panel);
  }

  #sidebar {
    width: 220px;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 1.2rem;
    transition: all 0.3s;
    backdrop-filter: blur(20px);
  }

  #sidebar h2 {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 0.8rem;
    font-weight: 700;
  }

  #nav-list {
    list-style: none;
    padding: 0;
    margin: 0 0 1.2rem;
  }

  #nav-list li {
    padding: 0.6rem 0.8rem;
    border-radius: 10px;
    font-size: 0.95rem;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.2s;
    color: var(--text-secondary);
  }

  #nav-list li:hover {
    background: rgba(255, 255, 255, 0.1);
    color: var(--text);
  }

  #nav-list li.active {
    background: rgba(102, 126, 234, 0.3);
    color: var(--text);
    border: 1px solid var(--accent);
  }

  #user-list {
    list-style: none;
    padding: 0;
    margin: 0;
    flex: 1;
    overflow-y: auto;
  }

  #user-list::-webkit-scrollbar {
    width: 6px;
  }

  #user-list::-webkit-scrollbar-track {
    background: transparent;
  }

  #user-list::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.2);
    border-radius: 3px;
  }

  #user-list li {
    padding: 0.6rem 0.8rem;
    border-radius: 10px;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    cursor: pointer;
    position: relative;
    transition: all 0.2s;
    color: var(--text-secondary);
  }

  #user-list li:hover {
    background: rgba(255, 255, 255, 0.1);
    color: var(--text);
  }

  #user-list li.active {
    background: rgba(102, 126, 234, 0.3);
    color: var(--text);
    border: 1px solid var(--accent);
  }

  #user-list li::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #34d399;
    display: inline-block;
    flex-shrink: 0;
    box-shadow: 0 0 8px rgba(52, 211, 153, 0.5);
  }

  #user-list li.offline::before {
    background: rgba(255, 255, 255, 0.3);
    box-shadow: none;
  }

  .unread-badge {
    margin-left: auto;
    background: linear-gradient(135deg, var(--accent), var(--accent-light));
    color: white;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 0.1rem 0.5rem;
    border-radius: 10px;
    box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
  }

  #theme-toggle-btn, #logout-btn {
    background: var(--panel-dark);
    border: 1px solid var(--border);
    padding: 0.65rem;
    border-radius: 10px;
    cursor: pointer;
    color: var(--text-secondary);
    font-size: 0.9rem;
    transition: all 0.3s;
    margin-bottom: 0.6rem;
    backdrop-filter: blur(10px);
  }

  #theme-toggle-btn:hover, #logout-btn:hover {
    background: rgba(255, 255, 255, 0.15);
    color: var(--text);
    border-color: var(--accent);
  }

  #chat-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  #chat-header {
    padding: 1.2rem 1.5rem;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    font-size: 1.1rem;
    transition: border-color 0.3s;
    backdrop-filter: blur(10px);
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
  }

  #messages::-webkit-scrollbar {
    width: 6px;
  }

  #messages::-webkit-scrollbar-track {
    background: transparent;
  }

  #messages::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.2);
    border-radius: 3px;
  }

  .msg-row {
    display: flex;
    flex-direction: column;
    max-width: 70%;
    gap: 0.3rem;
  }

  .msg-row.me {
    align-self: flex-end;
    align-items: flex-end;
  }

  .msg-row.other {
    align-self: flex-start;
    align-items: flex-start;
  }

  .msg-header {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0 0.2rem;
  }

  .msg-meta {
    font-size: 0.8rem;
    color: var(--text-secondary);
    transition: color 0.3s;
  }

  .msg-bubble {
    padding: 0.7rem 1rem;
    border-radius: 16px;
    font-size: 0.95rem;
    line-height: 1.5;
    word-wrap: break-word;
    white-space: pre-wrap;
    transition: all 0.3s;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  .msg-row.me .msg-bubble {
    background: var(--bubble-me);
    color: white;
    border-bottom-right-radius: 6px;
    box-shadow: 0 8px 16px rgba(102, 126, 234, 0.3);
  }

  .msg-row.other .msg-bubble {
    background: var(--bubble-other);
    color: var(--text);
    border-bottom-left-radius: 6px;
    border: 1px solid var(--border);
  }

  .system-msg {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    margin: 0.5rem 0;
    transition: color 0.3s;
    font-style: italic;
  }

  #input-bar {
    display: flex;
    gap: 0.8rem;
    padding: 1.2rem;
    border-top: 1px solid var(--border);
    transition: border-color 0.3s;
    backdrop-filter: blur(10px);
  }

  #msg-input {
    flex: 1;
    padding: 0.8rem 1.1rem;
    border: 1px solid var(--border);
    border-radius: 16px;
    font-size: 0.95rem;
    outline: none;
    background: rgba(255, 255, 255, 0.1);
    color: var(--text);
    transition: all 0.3s;
    backdrop-filter: blur(10px);
  }

  #msg-input:focus {
    border-color: var(--accent-light);
    background: rgba(255, 255, 255, 0.15);
    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
  }

  #msg-input::placeholder {
    color: var(--muted);
  }

  #send-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent-light));
    color: white;
    border: none;
    padding: 0 1.5rem;
    border-radius: 16px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.3s;
    box-shadow: 0 8px 16px rgba(102, 126, 234, 0.3);
  }

  #send-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 24px rgba(102, 126, 234, 0.4);
  }

  #send-btn:active {
    transform: translateY(0);
  }

  #conn-status {
    font-size: 0.8rem;
    color: var(--muted);
    font-weight: normal;
    transition: color 0.3s;
    margin-left: 0.8rem;
    opacity: 0.8;
  }
</style>
</head>
<body>

  <!-- AUTH SCREEN -->
  <div id="auth-screen" class="glass">
    <h1 id="auth-title">Welcome back</h1>
    <p class="sub" id="auth-sub">Log in to join the chat</p>
    <div id="auth-error"></div>
    <form id="auth-form">
      <label for="username">Username</label>
      <input id="username" autocomplete="username" required maxlength="24" />
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required minlength="4" />
      <div id="invite-field" style="display:none;">
        <label for="invite-code">Invite code</label>
        <input id="invite-code" autocomplete="off" />
      </div>
      <button type="submit" id="auth-submit">Log In</button>
    </form>
    <div id="auth-toggle">
      Don't have an account? <a id="auth-switch">Create one</a>
    </div>
  </div>

  <!-- CHAT SCREEN -->
  <div id="chat-screen" class="glass">
    <div id="sidebar">
      <ul id="nav-list">
        <li id="public-nav" class="active"># Public chat</li>
      </ul>
      <h2>Direct message <a id="new-dm-link" style="cursor:pointer;font-weight:600;color:var(--accent-light);text-transform:none;">+ New</a></h2>
      <ul id="user-list"></ul>
      <button id="theme-toggle-btn">🌙 Dark mode</button>
      <button id="logout-btn">Log out</button>
    </div>
    <div id="chat-main">
      <div id="chat-header"><span id="chat-header-title">LAN Chat</span> <span id="conn-status"></span></div>
      <div id="messages"></div>
      <div id="input-bar">
        <input id="msg-input" placeholder="Type a message…" autocomplete="off" />
        <button id="send-btn">Send</button>
      </div>
    </div>
  </div>

<script>
(function () {
  const authScreen = document.getElementById('auth-screen');
  const chatScreen = document.getElementById('chat-screen');
  const authForm = document.getElementById('auth-form');
  const authTitle = document.getElementById('auth-title');
  const authSub = document.getElementById('auth-sub');
  const authSubmit = document.getElementById('auth-submit');
  const authSwitch = document.getElementById('auth-switch');
  const authError = document.getElementById('auth-error');
  const usernameInput = document.getElementById('username');
  const passwordInput = document.getElementById('password');
  const inviteField = document.getElementById('invite-field');
  const inviteCodeInput = document.getElementById('invite-code');
  const messagesEl = document.getElementById('messages');
  const userListEl = document.getElementById('user-list');
  const msgInput = document.getElementById('msg-input');
  const sendBtn = document.getElementById('send-btn');
  const logoutBtn = document.getElementById('logout-btn');
  const themeToggleBtn = document.getElementById('theme-toggle-btn');
  const connStatus = document.getElementById('conn-status');

  let mode = 'login'; // or 'register'
  let ws = null;
  let myUsername = null;
  let darkMode = localStorage.getItem('lanchat_darkmode') === 'true';

  // Initialize theme
  function applyTheme() {
    if (darkMode) {
      document.documentElement.classList.add('dark');
      themeToggleBtn.textContent = '☀️ Light mode';
    } else {
      document.documentElement.classList.remove('dark');
      themeToggleBtn.textContent = '🌙 Dark mode';
    }
  }

  themeToggleBtn.addEventListener('click', () => {
    darkMode = !darkMode;
    localStorage.setItem('lanchat_darkmode', darkMode);
    applyTheme();
  });

  function setMode(next) {
    mode = next;
    authError.style.display = 'none';
    if (mode === 'login') {
      authTitle.textContent = 'Welcome back';
      authSub.textContent = 'Log in to join the chat';
      authSubmit.textContent = 'Log In';
      authSwitch.textContent = 'Create one';
      document.getElementById('auth-toggle').firstChild.textContent = "Don't have an account? ";
      passwordInput.autocomplete = 'current-password';
      inviteField.style.display = 'none';
      inviteCodeInput.required = false;
    } else {
      authTitle.textContent = 'Create an account';
      authSub.textContent = 'Pick a username and password to join';
      authSubmit.textContent = 'Sign Up';
      authSwitch.textContent = 'Log in';
      document.getElementById('auth-toggle').firstChild.textContent = 'Already have an account? ';
      passwordInput.autocomplete = 'new-password';
      inviteField.style.display = 'block';
      inviteCodeInput.required = true;
    }
  }

  authSwitch.addEventListener('click', () => setMode(mode === 'login' ? 'register' : 'login'));

  authForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    authError.style.display = 'none';
    const username = usernameInput.value.trim();
    const password = passwordInput.value;
    const endpoint = mode === 'login' ? '/api/login' : '/api/register';
    const body = { username, password };
    if (mode === 'register') {
      body.inviteCode = inviteCodeInput.value;
    }

    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) {
        authError.textContent = data.error || 'Something went wrong';
        authError.style.display = 'block';
        return;
      }
      sessionStorage.setItem('lanchat_token', data.token);
      sessionStorage.setItem('lanchat_username', data.username);
      enterChat(data.token, data.username);
    } catch (err) {
      authError.textContent = 'Could not reach the server. Is it running?';
      authError.style.display = 'block';
    }
  });

  logoutBtn.addEventListener('click', () => {
    sessionStorage.removeItem('lanchat_token');
    sessionStorage.removeItem('lanchat_username');
    if (ws) ws.close();
    chatScreen.style.display = 'none';
    authScreen.style.display = 'block';
    messagesEl.innerHTML = '';
    conversations = { public: [] };
    currentConversation = 'public';
    onlineUsers = [];
    knownDmPartners = new Set();
    unread = {};
    setMode('login');
  });

  // ---- Conversation state ----
  let conversations = { public: [] };
  let currentConversation = 'public';
  let onlineUsers = [];
  let knownDmPartners = new Set();
  let unread = {};

  function conversationKey(msg) {
    if (msg.type !== 'private') return 'public';
    return msg.from === myUsername ? msg.to : msg.from;
  }

  function renderMessagesFor(key) {
    messagesEl.innerHTML = '';
    const msgs = conversations[key] || [];
    msgs.forEach((m) => {
      if (m.type === 'system') addSystemMessageDom(m.text);
      else addMessageDom(m);
    });
  }

  function addSystemMessageDom(text) {
    const div = document.createElement('div');
    div.className = 'system-msg';
    div.textContent = text;
    messagesEl.appendChild(div);
  }

  function addMessageDom(msg) {
    const senderName = msg.type === 'private' ? msg.from : msg.username;
    const row = document.createElement('div');
    row.className = 'msg-row ' + (senderName === myUsername ? 'me' : 'other');

    const header = document.createElement('div');
    header.className = 'msg-header';

    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    const time = new Date(msg.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    meta.textContent = (senderName === myUsername ? 'You' : senderName) + ' · ' + time;
    header.appendChild(meta);

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = msg.text;

    row.appendChild(header);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function storeAndMaybeRender(msg) {
    const key = conversationKey(msg);
    if (!conversations[key]) conversations[key] = [];
    conversations[key].push(msg);

    if (key !== 'public') knownDmPartners.add(key);

    if (currentConversation === key) {
      if (msg.type === 'system') addSystemMessageDom(msg.text);
      else addMessageDom(msg);
      scrollToBottom();
    } else {
      unread[key] = (unread[key] || 0) + 1;
      renderSidebar();
    }
  }

  function switchConversation(key) {
    currentConversation = key;
    unread[key] = 0;
    document.getElementById('public-nav').classList.toggle('active', key === 'public');
    document.getElementById('chat-header-title').textContent = key === 'public' ? 'LAN Chat' : ('💬 ' + key);
    renderMessagesFor(key);
    renderSidebar();
    scrollToBottom();
  }

  function renderSidebar() {
    userListEl.innerHTML = '';
    const allNames = new Set([...onlineUsers, ...knownDmPartners]);
    allNames.forEach((u) => {
      if (u === myUsername) return;
      const li = document.createElement('li');
      li.className = onlineUsers.includes(u) ? '' : 'offline';
      if (u === currentConversation) li.classList.add('active');

      const dot = document.createElement('span');
      dot.style.display = 'inline-block';
      li.appendChild(dot);

      const label = document.createElement('span');
      label.textContent = u;
      li.appendChild(label);

      if (unread[u]) {
        const badge = document.createElement('span');
        badge.className = 'unread-badge';
        badge.textContent = unread[u];
        li.appendChild(badge);
      }

      li.addEventListener('click', () => switchConversation(u));
      userListEl.appendChild(li);
    });
  }

  document.getElementById('public-nav').addEventListener('click', () => switchConversation('public'));

  document.getElementById('new-dm-link').addEventListener('click', () => {
    const name = prompt('Username to message:');
    if (!name) return;
    const trimmed = name.trim();
    if (!trimmed || trimmed === myUsername) return;
    knownDmPartners.add(trimmed);
    switchConversation(trimmed);
  });

  function sendMessage() {
    const text = msgInput.value;
    if (!text.trim() || !ws || ws.readyState !== WebSocket.OPEN) return;
    if (currentConversation === 'public') {
      ws.send(JSON.stringify({ type: 'message', text }));
    } else {
      ws.send(JSON.stringify({ type: 'private', to: currentConversation, text }));
    }
    msgInput.value = '';
  }

  sendBtn.addEventListener('click', sendMessage);
  msgInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  function enterChat(token, username) {
    myUsername = username;
    authScreen.style.display = 'none';
    chatScreen.style.display = 'flex';
    messagesEl.innerHTML = '';
    connStatus.textContent = '(connecting…)';

    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(protocol + '//' + location.host);

    ws.addEventListener('open', () => {
      ws.send(JSON.stringify({ type: 'join', token }));
    });

    ws.addEventListener('message', (event) => {
      const data = JSON.parse(event.data);

      if (data.type === 'welcome') {
        connStatus.textContent = '(connected)';
        conversations = { public: data.history || [] };
        knownDmPartners = new Set(Object.keys(data.dms || {}));
        Object.entries(data.dms || {}).forEach(([other, msgs]) => {
          conversations[other] = msgs;
        });
        onlineUsers = data.users || [];
        switchConversation('public');
        return;
      }

      if (data.type === 'message' || data.type === 'private' || data.type === 'system') {
        storeAndMaybeRender(data);
        return;
      }

      if (data.type === 'users') {
        onlineUsers = data.users || [];
        renderSidebar();
        return;
      }

      if (data.type === 'dm_error') {
        addSystemMessageDom(data.text);
        scrollToBottom();
        return;
      }

      if (data.type === 'auth_error') {
        logoutBtn.click();
        authError.textContent = data.text;
        authError.style.display = 'block';
      }
    });

    ws.addEventListener('close', () => {
      connStatus.textContent = '(disconnected)';
    });
    ws.addEventListener('error', () => {
      connStatus.textContent = '(connection error)';
    });
  }

  // Auto-login if we already have a session token in this tab
  const savedToken = sessionStorage.getItem('lanchat_token');
  const savedUsername = sessionStorage.getItem('lanchat_username');
  applyTheme();
  if (savedToken && savedUsername) {
    enterChat(savedToken, savedUsername);
  } else {
    setMode('login');
  }
})();
</script>
</body>
</html>
