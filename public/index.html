<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inbox</title>
<link rel="manifest" href="/manifest.json" />
<link rel="icon" id="favicon" type="image/png" href="/icon.png" />
<link rel="apple-touch-icon" href="/icon.png" />
<meta name="apple-mobile-web-app-title" content="Inbox" />
<meta name="theme-color" content="#5b52f0" />
<style>
  :root {
    --bg-gradient: linear-gradient(135deg, #dbe4ff 0%, #f3e0f7 45%, #dcefff 100%);
    --glass: rgba(255, 255, 255, 0.5);
    --glass-strong: rgba(255, 255, 255, 0.72);
    --glass-border: rgba(255, 255, 255, 0.75);
    --glass-highlight: rgba(255, 255, 255, 0.7);
    --hover: rgba(255, 255, 255, 0.55);
    --accent: #5b52f0;
    --accent-dark: #4640c4;
    --text: #1f2330;
    --muted: #6b7080;
    --bubble-me: linear-gradient(135deg, #6a61f5, #5148e6);
    --bubble-other: rgba(255, 255, 255, 0.55);
    --border: rgba(255, 255, 255, 0.6);
    --shadow: 0 8px 32px rgba(31, 38, 80, 0.14);
    --blob1: rgba(124, 116, 255, 0.55);
    --blob2: rgba(255, 133, 214, 0.45);
    --blob3: rgba(120, 220, 255, 0.4);
  }
  :root.dark {
    --bg-gradient: linear-gradient(135deg, #0b0e1a 0%, #1a1230 45%, #0a1420 100%);
    --glass: rgba(30, 32, 48, 0.45);
    --glass-strong: rgba(30, 32, 48, 0.68);
    --glass-border: rgba(255, 255, 255, 0.1);
    --glass-highlight: rgba(255, 255, 255, 0.07);
    --hover: rgba(255, 255, 255, 0.07);
    --accent: #7c74ff;
    --accent-dark: #948dff;
    --text: #eef0f7;
    --muted: #9498ab;
    --bubble-me: linear-gradient(135deg, #6a61f5, #4a41d6);
    --bubble-other: rgba(255, 255, 255, 0.06);
    --border: rgba(255, 255, 255, 0.1);
    --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    --blob1: rgba(124, 116, 255, 0.35);
    --blob2: rgba(255, 105, 180, 0.22);
    --blob3: rgba(80, 200, 255, 0.25);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg-gradient);
    background-attachment: fixed;
    color: var(--text);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.3s ease, color 0.3s ease;
  }

  /* ---- Floating background blobs (the "liquid" behind the glass) ---- */
  #chat-screen, #auth-screen, #theme-toggle { z-index: 1; }
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(70px);
    z-index: 0;
    pointer-events: none;
  }
  .blob-1 {
    top: -15%; left: -10%;
    width: 55vw; height: 55vw;
    background: radial-gradient(circle, var(--blob1), transparent 70%);
    animation: floatA 20s ease-in-out infinite;
  }
  .blob-2 {
    bottom: -20%; right: -12%;
    width: 60vw; height: 60vw;
    background: radial-gradient(circle, var(--blob2), transparent 70%);
    animation: floatB 24s ease-in-out infinite;
  }
  .blob-3 {
    top: 35%; left: 55%;
    width: 40vw; height: 40vw;
    background: radial-gradient(circle, var(--blob3), transparent 70%);
    animation: floatC 28s ease-in-out infinite;
  }
  @keyframes floatA { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(4%, 5%); } }
  @keyframes floatB { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-5%, -4%); } }
  @keyframes floatC { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-3%, 3%) scale(1.08); } }

  /* ---- Glass building block ---- */
  .glass {
    background: var(--glass);
    backdrop-filter: blur(30px) saturate(190%);
    -webkit-backdrop-filter: blur(30px) saturate(190%);
    border: 1px solid var(--glass-border);
    box-shadow: var(--shadow), inset 0 1px 0 var(--glass-highlight);
  }

  /* ---- Theme toggle ---- */
  #theme-toggle {
    position: fixed;
    top: 22px;
    right: 22px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    font-size: 1.15rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
    transition: transform 0.15s ease, background-color 0.2s ease;
  }
  #theme-toggle:hover { transform: scale(1.06); }

  /* ---- Unified button system ---- */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    border: none;
    border-radius: 12px;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    padding: 0.65rem 1.1rem;
    transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.1s ease;
    white-space: nowrap;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: var(--bubble-me);
    color: #ffffff;
    box-shadow: 0 4px 14px rgba(91, 82, 240, 0.35), inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-secondary {
    background: var(--glass);
    backdrop-filter: blur(16px) saturate(160%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    border: 1px solid var(--glass-border);
    color: var(--muted);
  }
  .btn-secondary:hover { background: var(--hover); }
  .btn-block { width: 100%; }
  .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.85rem; border-radius: 9px; }

  /* ---- Auth screen ---- */
  #auth-screen {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    border: none;
    border-radius: 0;
    box-shadow: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #auth-card {
    width: 100%;
    max-width: 380px;
    padding: 2rem;
  }
  #auth-screen h1 {
    margin: 0 0 0.25rem;
    font-size: 1.5rem;
  }
  #auth-screen p.sub {
    margin: 0 0 1.5rem;
    color: var(--muted);
    font-size: 0.9rem;
  }
  #auth-screen label {
    display: block;
    font-size: 0.85rem;
    margin-bottom: 0.35rem;
    color: var(--muted);
  }
  #auth-screen input {
    width: 100%;
    padding: 0.65rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 1rem;
    font-size: 1rem;
    font-family: inherit;
    background: var(--glass);
    color: var(--text);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  #auth-toggle {
    margin-top: 1.25rem;
    text-align: center;
    font-size: 0.9rem;
    color: var(--muted);
  }
  #auth-toggle a { color: var(--accent); cursor: pointer; text-decoration: none; font-weight: 600; }
  #auth-error {
    background: rgba(239, 68, 68, 0.15);
    color: #ef4444;
    border: 1px solid rgba(239, 68, 68, 0.3);
    padding: 0.6rem 0.8rem;
    border-radius: 12px;
    font-size: 0.85rem;
    margin-bottom: 1rem;
    display: none;
  }

  /* ---- Chat screen ---- */
  #chat-screen {
    display: none;
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    max-width: none;
    border: none;
    border-radius: 0;
    box-shadow: none;
    overflow: hidden;
    flex-direction: row;
  }
  #sidebar {
    width: 220px;
    background: var(--glass-strong);
    border-right: 1px solid var(--glass-border);
    display: flex;
    flex-direction: column;
    padding: 1.1rem;
    gap: 0.25rem;
  }
  #sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 0.25rem 0 0.75rem;
  }
  #sidebar-header h2 {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin: 0;
  }
  #nav-list { list-style: none; padding: 0; margin: 0 0 1rem; }
  #nav-list li {
    padding: 0.55rem 0.65rem;
    border-radius: 11px;
    font-size: 0.9rem;
    cursor: pointer;
    font-weight: 600;
    transition: background-color 0.15s ease;
  }
  #nav-list li:hover, #nav-list li.active { background: var(--hover); }
  #user-list { list-style: none; padding: 0; margin: 0; flex: 1; overflow-y: auto; }
  #user-list li {
    padding: 0.55rem 0.65rem;
    border-radius: 11px;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
    position: relative;
    transition: background-color 0.15s ease;
  }
  #user-list li:hover, #user-list li.active { background: var(--hover); }
  #user-list li::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 6px rgba(34, 197, 94, 0.6);
    display: inline-block;
    flex-shrink: 0;
  }
  #user-list li.offline::before { background: #9aa0ac; box-shadow: none; }
  .unread-badge {
    margin-left: auto;
    background: var(--accent);
    color: white;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 0.05rem 0.4rem;
    border-radius: 10px;
  }
  .kick-btn {
    margin-left: auto;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 0.7rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    opacity: 0;
    transition: opacity 0.15s ease, background-color 0.15s ease, color 0.15s ease;
  }
  #user-list li:hover .kick-btn { opacity: 1; }
  .kick-btn:hover { background: #ef4444; color: white; }

  #logout-btn { margin-top: 0.5rem; }

  #chat-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--glass);
  }
  #chat-header {
    padding: 1.1rem 1.4rem;
    border-bottom: 1px solid var(--glass-border);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  #fav-toggle-btn {
    margin-left: auto;
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 1.3rem;
    line-height: 1;
    color: var(--muted);
    display: none;
    padding: 0;
    transition: color 0.15s ease, transform 0.1s ease;
  }
  #fav-toggle-btn:hover { transform: scale(1.1); }
  #fav-toggle-btn.is-fav { color: #eab308; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 1.4rem;
    display: flex;
    flex-direction: column;
    gap: 0.65rem;
  }
  .msg-row { display: flex; flex-direction: column; max-width: 75%; }
  .msg-row.me { align-self: flex-end; align-items: flex-end; }
  .msg-row.other { align-self: flex-start; align-items: flex-start; }
  .msg-meta { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.2rem; display: flex; align-items: center; gap: 0.35rem; }
  .delete-msg-btn {
    border: none;
    background: rgba(239, 68, 68, 0.12);
    cursor: pointer;
    font-size: 0.8rem;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    opacity: 0.85;
    transition: opacity 0.15s ease, background-color 0.15s ease, transform 0.1s ease;
  }
  .delete-msg-btn:hover { opacity: 1; background: rgba(239, 68, 68, 0.35); transform: scale(1.1); }
  .msg-bubble {
    padding: 0.6rem 0.9rem;
    border-radius: 16px;
    font-size: 0.95rem;
    line-height: 1.4;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .msg-row.me .msg-bubble {
    background: var(--bubble-me);
    color: white;
    border-bottom-right-radius: 5px;
    box-shadow: 0 4px 14px rgba(91, 82, 240, 0.3), inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .msg-row.other .msg-bubble {
    background: var(--bubble-other);
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    border: 1px solid var(--glass-border);
    color: var(--text);
    border-bottom-left-radius: 5px;
  }
  .system-msg {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    margin: 0.3rem 0;
  }
  #input-bar {
    display: flex;
    gap: 0.6rem;
    padding: 1.1rem;
    border-top: 1px solid var(--glass-border);
  }
  #msg-input {
    flex: 1;
    padding: 0.65rem 0.9rem;
    border: 1px solid var(--border);
    border-radius: 14px;
    font-size: 0.95rem;
    font-family: inherit;
    outline: none;
    background: var(--glass);
    color: var(--text);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  #conn-status {
    font-size: 0.75rem;
    color: var(--muted);
    font-weight: normal;
  }
</style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <button id="theme-toggle" class="glass" title="Toggle dark mode">🌙</button>

  <!-- AUTH SCREEN -->
  <div id="auth-screen" class="glass">
    <div id="auth-card">
      <h1 id="auth-title">Welcome back</h1>
      <p class="sub" id="auth-sub">Log in to join the chat</p>
      <div id="auth-error"></div>
      <form id="auth-form">
        <label for="username">Username</label>
        <input id="username" autocomplete="username" required maxlength="24" />
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required minlength="4" />
        <div id="invite-field" style="display:none;">
          <label for="invite-code">Invite code</label>
          <input id="invite-code" autocomplete="off" />
        </div>
        <button type="submit" id="auth-submit" class="btn btn-primary btn-block">Log In</button>
      </form>
      <div id="auth-toggle">
        Don't have an account? <a id="auth-switch">Create one</a>
      </div>
    </div>
  </div>

  <!-- CHAT SCREEN -->
  <div id="chat-screen" class="glass">
    <div id="sidebar">
      <ul id="nav-list">
        <li id="public-nav" class="active"># Public chat</li>
      </ul>
      <div id="sidebar-header">
        <h2>Direct messages</h2>
      </div>
      <ul id="user-list"></ul>
      <button id="admin-btn" class="btn btn-secondary btn-sm">🔒 Admin</button>
      <button id="logout-btn" class="btn btn-secondary btn-sm">Log out</button>
    </div>
    <div id="chat-main">
      <div id="chat-header"><span id="chat-header-title">Inbox</span> <span id="conn-status"></span><button id="fav-toggle-btn" title="Favorite this person">☆</button></div>
      <div id="messages"></div>
      <div id="input-bar">
        <input id="msg-input" placeholder="Type a message…" autocomplete="off" />
        <button id="send-btn" class="btn btn-primary">Send</button>
      </div>
    </div>
  </div>

<script>
(function () {
  // ---- Theme (dark mode) ----
  const themeToggle = document.getElementById('theme-toggle');
  function applyTheme(dark) {
    document.documentElement.classList.toggle('dark', dark);
    themeToggle.textContent = dark ? '☀️' : '🌙';
    localStorage.setItem('lanchat_theme', dark ? 'dark' : 'light');
  }
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const savedTheme = localStorage.getItem('lanchat_theme');
  applyTheme(savedTheme ? savedTheme === 'dark' : prefersDark);
  themeToggle.addEventListener('click', () => {
    applyTheme(!document.documentElement.classList.contains('dark'));
  });

  // ---- Unread badge (favicon bubble + tab title + OS taskbar badge) ----
  const APP_TITLE = 'Inbox';
  const faviconEl = document.getElementById('favicon');
  const badgeCanvas = document.createElement('canvas');
  badgeCanvas.width = 64;
  badgeCanvas.height = 64;
  const badgeCtx = badgeCanvas.getContext('2d');
  const logoImg = new Image();
  let logoReady = false;
  logoImg.onload = () => {
    logoReady = true;
    drawFavicon(0);
  };
  logoImg.src = '/icon.png';

  function drawFavicon(count) {
    if (!logoReady) return;
    badgeCtx.clearRect(0, 0, 64, 64);
    badgeCtx.drawImage(logoImg, 0, 0, 64, 64);
    if (count > 0) {
      const label = count > 99 ? '99+' : String(count);
      const radius = label.length > 2 ? 20 : 16;
      const cx = 64 - radius + 4;
      const cy = radius - 4;
      badgeCtx.beginPath();
      badgeCtx.arc(cx, cy, radius, 0, Math.PI * 2);
      badgeCtx.fillStyle = '#ef4444';
      badgeCtx.fill();
      badgeCtx.lineWidth = 3;
      badgeCtx.strokeStyle = '#ffffff';
      badgeCtx.stroke();
      badgeCtx.fillStyle = '#ffffff';
      badgeCtx.font = `bold ${label.length > 2 ? 18 : 22}px -apple-system, sans-serif`;
      badgeCtx.textAlign = 'center';
      badgeCtx.textBaseline = 'middle';
      badgeCtx.fillText(label, cx, cy + 1);
    }
    faviconEl.href = badgeCanvas.toDataURL('image/png');
  }

  function updateBadge() {
    const total = Object.values(unread).reduce((sum, n) => sum + n, 0);
    document.title = total > 0 ? `(${total > 99 ? '99+' : total}) ${APP_TITLE}` : APP_TITLE;
    drawFavicon(total);
    if ('setAppBadge' in navigator) {
      if (total > 0) navigator.setAppBadge(total).catch(() => {});
      else navigator.clearAppBadge().catch(() => {});
    }
  }

  const authScreen = document.getElementById('auth-screen');
  const chatScreen = document.getElementById('chat-screen');
  const authForm = document.getElementById('auth-form');
  const authTitle = document.getElementById('auth-title');
  const authSub = document.getElementById('auth-sub');
  const authSubmit = document.getElementById('auth-submit');
  const authSwitch = document.getElementById('auth-switch');
  const authError = document.getElementById('auth-error');
  const usernameInput = document.getElementById('username');
  const passwordInput = document.getElementById('password');
  const inviteField = document.getElementById('invite-field');
  const inviteCodeInput = document.getElementById('invite-code');
  const messagesEl = document.getElementById('messages');
  const userListEl = document.getElementById('user-list');
  const msgInput = document.getElementById('msg-input');
  const sendBtn = document.getElementById('send-btn');
  const logoutBtn = document.getElementById('logout-btn');
  const adminBtn = document.getElementById('admin-btn');
  const connStatus = document.getElementById('conn-status');
  const favToggleBtn = document.getElementById('fav-toggle-btn');

  let mode = 'login'; // or 'register'
  let ws = null;
  let myUsername = null;

  function setMode(next) {
    mode = next;
    authError.style.display = 'none';
    if (mode === 'login') {
      authTitle.textContent = 'Welcome back';
      authSub.textContent = 'Log in to join the chat';
      authSubmit.textContent = 'Log In';
      authSwitch.textContent = 'Create one';
      document.getElementById('auth-toggle').firstChild.textContent = "Don't have an account? ";
      passwordInput.autocomplete = 'current-password';
      inviteField.style.display = 'none';
      inviteCodeInput.required = false;
    } else {
      authTitle.textContent = 'Create an account';
      authSub.textContent = 'Pick a username and password to join';
      authSubmit.textContent = 'Sign Up';
      authSwitch.textContent = 'Log in';
      document.getElementById('auth-toggle').firstChild.textContent = 'Already have an account? ';
      passwordInput.autocomplete = 'new-password';
      inviteField.style.display = 'block';
      inviteCodeInput.required = true;
    }
  }

  authSwitch.addEventListener('click', () => setMode(mode === 'login' ? 'register' : 'login'));

  authForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    authError.style.display = 'none';
    const username = usernameInput.value.trim();
    const password = passwordInput.value;
    const endpoint = mode === 'login' ? '/api/login' : '/api/register';
    const body = { username, password };
    if (mode === 'register') body.inviteCode = inviteCodeInput.value;

    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) {
        authError.textContent = data.error || 'Something went wrong';
        authError.style.display = 'block';
        return;
      }
      sessionStorage.setItem('lanchat_token', data.token);
      sessionStorage.setItem('lanchat_username', data.username);
      enterChat(data.token, data.username);
    } catch (err) {
      authError.textContent = 'Could not reach the server. Is it running?';
      authError.style.display = 'block';
    }
  });

  logoutBtn.addEventListener('click', () => {
    sessionStorage.removeItem('lanchat_token');
    sessionStorage.removeItem('lanchat_username');
    if (ws) ws.close();
    chatScreen.style.display = 'none';
    authScreen.style.display = 'flex';
    messagesEl.innerHTML = '';
    conversations = { public: [] };
    currentConversation = 'public';
    onlineUsers = [];
    knownDmPartners = new Set();
    unread = {};
    iAmAdmin = false;
    adminBtn.textContent = '🔒 Admin';
    favorites = new Set();
    favToggleBtn.style.display = 'none';
    updateBadge();
    setMode('login');
  });

  adminBtn.addEventListener('click', () => {
    if (iAmAdmin) return; // already unlocked this session
    const code = prompt('Enter the admin code:');
    if (!code) return;
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: 'admin_login', code }));
  });

  // ---- Conversation state ----
  // conversations.public = [msgs...]; conversations[otherUsername] = [dm msgs...]
  let conversations = { public: [] };
  let currentConversation = 'public'; // 'public' or a username
  let onlineUsers = [];
  let knownDmPartners = new Set(); // usernames we have any DM history with
  let unread = {}; // conversation key -> count
  let iAmAdmin = false;
  let favorites = new Set();

  function favoritesKey(username) {
    return `lanchat_favorites_${username}`;
  }
  function loadFavorites(username) {
    try {
      const raw = localStorage.getItem(favoritesKey(username));
      return raw ? new Set(JSON.parse(raw)) : new Set();
    } catch (e) {
      return new Set();
    }
  }
  function saveFavorites() {
    if (!myUsername) return;
    localStorage.setItem(favoritesKey(myUsername), JSON.stringify([...favorites]));
  }
  function toggleFavorite(username) {
    if (favorites.has(username)) favorites.delete(username);
    else favorites.add(username);
    saveFavorites();
    renderSidebar();
    updateFavToggleBtn();
  }
  function updateFavToggleBtn() {
    if (currentConversation === 'public') {
      favToggleBtn.style.display = 'none';
      return;
    }
    favToggleBtn.style.display = 'block';
    const isFav = favorites.has(currentConversation);
    favToggleBtn.textContent = isFav ? '★' : '☆';
    favToggleBtn.classList.toggle('is-fav', isFav);
    favToggleBtn.title = isFav ? `Unfavorite ${currentConversation}` : `Favorite ${currentConversation}`;
  }

  function conversationKey(msg) {
    // for private messages, the "other person" from my perspective
    if (msg.type !== 'private') return 'public';
    return msg.from === myUsername ? msg.to : msg.from;
  }

  function renderMessagesFor(key) {
    messagesEl.innerHTML = '';
    const msgs = conversations[key] || [];
    msgs.forEach((m) => {
      if (m.type === 'system') addSystemMessageDom(m.text);
      else addMessageDom(m);
    });
  }

  function addSystemMessageDom(text) {
    const div = document.createElement('div');
    div.className = 'system-msg';
    div.textContent = text;
    messagesEl.appendChild(div);
  }

  function addMessageDom(msg) {
    const senderName = msg.type === 'private' ? msg.from : msg.username;
    const row = document.createElement('div');
    row.className = 'msg-row ' + (senderName === myUsername ? 'me' : 'other');
    if (msg.id) row.dataset.msgId = msg.id;

    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    const time = new Date(msg.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    meta.textContent = (senderName === myUsername ? 'You' : senderName) + ' · ' + time;

    if (iAmAdmin && msg.id) {
      const delBtn = document.createElement('button');
      delBtn.className = 'delete-msg-btn';
      delBtn.title = 'Delete this message';
      delBtn.textContent = '🗑';
      delBtn.addEventListener('click', () => {
        if (confirm('Delete this message for everyone?')) {
          ws.send(JSON.stringify({ type: 'delete_message', id: msg.id }));
        }
      });
      meta.appendChild(delBtn);
    }

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = msg.text;

    row.appendChild(meta);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function storeAndMaybeRender(msg) {
    const key = conversationKey(msg);
    if (!conversations[key]) conversations[key] = [];
    conversations[key].push(msg);

    if (key !== 'public') knownDmPartners.add(key);

    if (currentConversation === key) {
      if (msg.type === 'system') addSystemMessageDom(msg.text);
      else addMessageDom(msg);
      scrollToBottom();
    } else {
      unread[key] = (unread[key] || 0) + 1;
      renderSidebar();
      updateBadge();
    }
  }

  function switchConversation(key) {
    currentConversation = key;
    unread[key] = 0;
    document.getElementById('public-nav').classList.toggle('active', key === 'public');
    document.getElementById('chat-header-title').textContent = key === 'public' ? 'Inbox' : ('💬 ' + key);
    renderMessagesFor(key);
    renderSidebar();
    scrollToBottom();
    updateBadge();
    updateFavToggleBtn();
  }

  function renderSidebar() {
    userListEl.innerHTML = '';
    // combine currently-online users and anyone we've DMed before (in case they went offline)
    const allNames = [...new Set([...onlineUsers, ...knownDmPartners])].filter((u) => u !== myUsername);
    // favorites first (alphabetical), then everyone else (alphabetical)
    allNames.sort((a, b) => {
      const favA = favorites.has(a) ? 0 : 1;
      const favB = favorites.has(b) ? 0 : 1;
      if (favA !== favB) return favA - favB;
      return a.localeCompare(b);
    });
    allNames.forEach((u) => {
      const li = document.createElement('li');
      li.className = onlineUsers.includes(u) ? '' : 'offline';
      if (u === currentConversation) li.classList.add('active');

      const label = document.createElement('span');
      label.textContent = (favorites.has(u) ? '★ ' : '') + u;
      li.appendChild(label);

      if (unread[u]) {
        const badge = document.createElement('span');
        badge.className = 'unread-badge';
        badge.textContent = unread[u];
        li.appendChild(badge);
      }

      if (iAmAdmin && onlineUsers.includes(u)) {
        const kickBtn = document.createElement('button');
        kickBtn.className = 'kick-btn';
        kickBtn.title = `Remove ${u} from the chat`;
        kickBtn.textContent = '✕';
        kickBtn.addEventListener('click', (e) => {
          e.stopPropagation(); // don't also trigger switchConversation
          if (confirm(`Remove ${u} from the chat? They can log back in afterward.`)) {
            ws.send(JSON.stringify({ type: 'kick', target: u }));
          }
        });
        li.appendChild(kickBtn);
      }

      li.addEventListener('click', () => switchConversation(u));
      userListEl.appendChild(li);
    });
  }

  document.getElementById('public-nav').addEventListener('click', () => switchConversation('public'));

  favToggleBtn.addEventListener('click', () => {
    if (currentConversation === 'public') return;
    toggleFavorite(currentConversation);
  });

  function sendMessage() {
    const text = msgInput.value;
    if (!text.trim() || !ws || ws.readyState !== WebSocket.OPEN) return;
    if (currentConversation === 'public') {
      ws.send(JSON.stringify({ type: 'message', text }));
    } else {
      ws.send(JSON.stringify({ type: 'private', to: currentConversation, text }));
    }
    msgInput.value = '';
  }

  sendBtn.addEventListener('click', sendMessage);
  msgInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  function enterChat(token, username) {
    myUsername = username;
    favorites = loadFavorites(username);
    authScreen.style.display = 'none';
    chatScreen.style.display = 'flex';
    messagesEl.innerHTML = '';
    connStatus.textContent = '(connecting…)';

    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(protocol + '//' + location.host);

    ws.addEventListener('open', () => {
      ws.send(JSON.stringify({ type: 'join', token }));
    });

    ws.addEventListener('message', (event) => {
      const data = JSON.parse(event.data);

      if (data.type === 'welcome') {
        connStatus.textContent = '(connected)';
        conversations = { public: data.history || [] };
        knownDmPartners = new Set(Object.keys(data.dms || {}));
        Object.entries(data.dms || {}).forEach(([other, msgs]) => {
          conversations[other] = msgs;
        });
        onlineUsers = data.users || [];
        switchConversation('public');
        return;
      }

      if (data.type === 'message' || data.type === 'private' || data.type === 'system') {
        storeAndMaybeRender(data);
        return;
      }

      if (data.type === 'users') {
        onlineUsers = data.users || [];
        renderSidebar();
        return;
      }

      if (data.type === 'dm_error') {
        addSystemMessageDom(data.text);
        scrollToBottom();
        return;
      }

      if (data.type === 'kicked') {
        const message = `You were removed from the chat by ${data.by}. You can log back in any time.`;
        logoutBtn.click();
        authError.textContent = message;
        authError.style.display = 'block';
        return;
      }

      if (data.type === 'admin_login_result') {
        if (data.success) {
          iAmAdmin = true;
          adminBtn.textContent = '🔓 Admin mode on';
          renderSidebar();
        } else {
          alert(data.error || 'Wrong admin code');
        }
        return;
      }

      if (data.type === 'message_deleted') {
        // remove it from every cached conversation so it doesn't reappear on switch
        Object.values(conversations).forEach((msgs) => {
          const idx = msgs.findIndex((m) => m.id === data.id);
          if (idx !== -1) msgs.splice(idx, 1);
        });
        const row = messagesEl.querySelector(`[data-msg-id="${CSS.escape(data.id)}"]`);
        if (row) row.remove();
        return;
      }

      if (data.type === 'auth_error') {
        logoutBtn.click();
        authError.textContent = data.text;
        authError.style.display = 'block';
      }
    });

    ws.addEventListener('close', () => {
      connStatus.textContent = '(disconnected)';
    });
    ws.addEventListener('error', () => {
      connStatus.textContent = '(connection error)';
    });
  }

  // Auto-login if we already have a session token in this tab
  const savedToken = sessionStorage.getItem('lanchat_token');
  const savedUsername = sessionStorage.getItem('lanchat_username');
  if (savedToken && savedUsername) {
    enterChat(savedToken, savedUsername);
  } else {
    setMode('login');
  }
})();
</script>
</body>
</html>
